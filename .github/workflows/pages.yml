# Publish the homepage (site/) to GitHub Pages. Only site/ (minus its DESIGN.md)
# is uploaded, so nothing else in the repository (docs/, loop folders) is published.
name: Deploy homepage

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # The page's design notes (DESIGN.md) stay in the repository, off the site.
      - run: rsync -a --exclude DESIGN.md site/ _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
